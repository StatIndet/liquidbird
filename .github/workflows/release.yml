name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python3 scripts/check.py
      - name: Test synthetic demo profile
        run: python3 -m unittest discover -s tests
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\n' < VERSION)"
      - name: Build release archive
        run: python3 scripts/package_release.py --version "${GITHUB_REF_NAME#v}" --output dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/LiquidBird-*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "LiquidBird $GITHUB_REF_NAME"
